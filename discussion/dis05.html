<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dress up Kaya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dis05.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="dis05.js" defer></script>
</head>
<body>

    <img id="kaya-photo" src="kaya-harness.jpg" alt="Kaya the corgi">
    <h1 id="status">Pick an outfit for Kaya!</h1>

    <!-- every outfit button has the class "outfit" and an id that matches its photo -->
    <button class="outfit" id="witch">witch</button>
    <src="kaya-witch.jpg">
    <button class="outfit" id="scarf">scarf</button>
    <src="kaya-scarf.jpg">
    <button class="outfit" id="harness">harness</button>
    <src="kaya-harness.jpg">
    <button class="outfit" id="cone">cone</button>
    <src-"kaya-cone.jpg">
    <!-- STRETCH: this one is NOT an outfit, so it has a different id and no "outfit" class -->
    <button id="surprise">surprise me!</button>

</body>
</html>
